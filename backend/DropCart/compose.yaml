services:

  # =========================
  # Django API
  # =========================
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dropcart_web

    env_file:
      - .env

    command:
      [
        "waitress-serve",
        "--host=0.0.0.0",
        "--port=8000",
        "--threads=4",
        "DropCart.wsgi:application"
      ]

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - dropcart_network


  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7-alpine

    container_name: dropcart_redis

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    expose:
      - "6379"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dropcart_network


  # =========================
  # Celery Worker
  # =========================
  celery:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dropcart_celery

    env_file:
      - .env

    command:
      [
        "celery",
        "-A",
        "DropCart",
        "worker",
        "--loglevel=info"
      ]

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - dropcart_network


  # =========================
  # Celery Beat
  # =========================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dropcart_celery_beat

    env_file:
      - .env

    command:
      [
        "celery",
        "-A",
        "DropCart",
        "beat",
        "--loglevel=info"
      ]

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - dropcart_network


# =========================
# Persistent volumes
# =========================
volumes:
  redis_data:


# =========================
# Internal application network
# =========================
networks:
  dropcart_network:
    driver: bridge